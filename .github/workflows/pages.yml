name: OPENCONNECT build and Pages

on:
  push:
    branches:
      - openconnect/bootstrap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openconnect-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned upstream Reticulum and LXMF
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Runtime smoke test (hard limit 45 seconds)
        run: |
          timeout 45s bash -c 'python -m py_compile src/oc_node.py src/oc_protocol.py && python src/oc_node.py --help'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload static portal
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          timeout: 2m
